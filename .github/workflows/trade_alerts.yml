name: Trade Alerts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC, best-effort timing on GitHub free tier)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit state.json back

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trade alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python sr_trade_alerts.py

      - name: Save alert dedup state
        run: |
          git config user.name "trade-alerts-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
